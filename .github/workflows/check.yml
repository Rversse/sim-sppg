name: Check SIM-SPPG

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible dependency security fixes
        run: npm audit fix

      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const r = require("/tmp/npm-audit.json"); const v = r.vulnerabilities || {}; console.log("Dependency vulnerabilities:", JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(v)) console.log(JSON.stringify({name, severity:item.severity, isDirect:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:(item.via || []).map(x => typeof x === "string" ? x : x.title)}))'

      - name: Upload patched dependency lockfile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-security-patched-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Lint and build
        run: npm run check
