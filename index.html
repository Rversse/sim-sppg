<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./fav.svg" />
    <link rel="icon" type="image/png" href="./fav.png" sizes="200x200" />
    <link rel="apple-touch-icon" href="./fav.png" />
    <link rel="mask-icon" href="./fav.svg" color="#0b132b" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Informasi Manajemen - SPPG</title>
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('sim-sppg-theme') === 'light' ? 'light' : 'dark'
        } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.content = theme === 'dark' ? '#0a1220' : '#f4f8fc'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
